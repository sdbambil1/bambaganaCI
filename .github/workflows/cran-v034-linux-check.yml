name: CRAN candidate 0.3.4 - Linux

on:
  push:
    branches:
      - cran-v034-linux-check
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-cran-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Confirm candidate version
        shell: bash
        run: |
          test "$(sed -n 's/^Version: //p' DESCRIPTION | tr -d '\r')" = "0.3.4"

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - name: Check package on Linux as CRAN
        shell: bash
        run: |
          set -euo pipefail
          R CMD build . 2>&1 | tee build.log
          R CMD check --as-cran --no-manual bambaganaCI_0.3.4.tar.gz 2>&1 | tee check-console.log
          grep '^Status:' bambaganaCI.Rcheck/00check.log

      - name: Upload check logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-cran-v034-logs
          path: |
            build.log
            check-console.log
            bambaganaCI.Rcheck/00check.log
          if-no-files-found: warn
