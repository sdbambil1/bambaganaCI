name: CRAN candidate 0.3.4 - Linux

on:
  push:
    branches:
      - cran-v034-linux-check
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-cran-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify exact candidate archive
        shell: bash
        run: |
          test -f validation/bambaganaCI_0.3.4.tar.gz
          tar -xzOf validation/bambaganaCI_0.3.4.tar.gz bambaganaCI/DESCRIPTION | grep -q '^Version: 0.3.4$'

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - name: Check uploaded source archive on Linux
        shell: bash
        run: |
          set -euo pipefail
          R CMD check --as-cran --no-manual validation/bambaganaCI_0.3.4.tar.gz 2>&1 | tee check-console.log
          grep '^Status:' bambaganaCI.Rcheck/00check.log

      - name: Upload check logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-cran-v034-logs
          path: |
            check-console.log
            bambaganaCI.Rcheck/00check.log
          if-no-files-found: warn
