name: Publish validated bambaganaCI v0.3.4

on:
  push:
    branches:
      - cran-v034-linux-check
    paths:
      - .github/workflows/publish-v034-release.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tested archive
        uses: actions/checkout@v4
        with:
          ref: cran-v034-linux-check
          path: candidate

      - name: Check out public main
        uses: actions/checkout@v4
        with:
          ref: main
          path: public
          fetch-depth: 0

      - name: Verify validated source and update public package
        shell: bash
        run: |
          set -euo pipefail
          test -f candidate/validation/bambaganaCI_0.3.4.tar.gz
          mkdir -p extracted
          tar -xzf candidate/validation/bambaganaCI_0.3.4.tar.gz -C extracted
          test "$(sed -n 's/^Version: //p' extracted/bambaganaCI/DESCRIPTION | tr -d '\r')" = "0.3.4"
          test "$(sed -n 's/^Version: //p' public/DESCRIPTION | tr -d '\r')" = "0.3.3"
          test ! -e public/.git/refs/tags/v0.3.4
          diff -qr public/R extracted/bambaganaCI/R
          diff -qr public/tests extracted/bambaganaCI/tests
          diff -qr public/vignettes extracted/bambaganaCI/vignettes --exclude='.gitignore'
          python3 - <<'PY'
          from pathlib import Path
          import filecmp
          a=Path('public/man')
          b=Path('extracted/bambaganaCI/man')
          for f in b.iterdir():
              if f.name == 'bambagana.Rd': continue
              assert (a/f.name).exists() and filecmp.cmp(a/f.name, f, shallow=False), f"Unexpected documentation change: {f.name}"
          PY
          cp extracted/bambaganaCI/DESCRIPTION public/DESCRIPTION
          cp extracted/bambaganaCI/NEWS.md public/NEWS.md
          cp extracted/bambaganaCI/man/bambagana.Rd public/man/bambagana.Rd
          python3 - <<'PY'
          from pathlib import Path
          readme = '''# bambaganaCI

          **Confidence intervals and classical statistical inference in R**

          **Version 0.3.4** · 40 statistical functions · 43 public exports

          **Authors:** Silas Bambil and Yasmeen Babagana. Both authors contributed equally to the original project.

          bambaganaCI provides a beginner-friendly `bambagana()` interface for descriptive statistics, confidence intervals, bootstrap methods, hypothesis testing, association measures, linear regression, analysis of variance, and power planning. The original statistical functions remain directly accessible. The package implements or interfaces with established methods rather than proposing new statistical theory.

          ## Installation

          Install the released version from GitHub:

          ```r
          install.packages("remotes") # if needed
          remotes::install_github("sdbambil1/bambaganaCI", ref = "v0.3.4")
          library(bambaganaCI)
          ```

          This GitHub release is separate from CRAN publication. **The package has not been accepted by or submitted to CRAN.**

          ## Examples

          ```r
          library(bambaganaCI)
          scores <- c(65, 72, 68, 75, 70, 78, 74, 69, 73, 76)
          other  <- c(71, 79, 75, 82, 77, 85, 80, 74, 78, 81)
          bambagana("descriptive statistics", scores)
          bambagana("confidence interval", scores)
          bambagana("compare averages", scores, other)
          bambagana("hypothesis test", scores, mu = 70)
          bambagana("all functions")
          set.seed(1998)
          bambagana("bootstrap confidence interval", scores, B = 999)
          ```

          For additional examples and method-specific assumptions, see the [package documentation](https://sdbambil1.github.io/bambaganaci.html), the installed help pages, and the getting-started vignette.

          ## Methods and limitations

          Bootstrap inference for the population mean ordinarily assumes independent, identically distributed observations. Classical t intervals are exact under independent normal sampling with a common positive variance. Coverage and test behavior can differ under skewness, heavy tails, sparse observations, clustering, and other departures from the assumptions. This package does not automatically account for complex survey designs or serial dependence.

          ## Validation

          The exact v0.3.4 source archive passed `R CMD check --as-cran` with no errors or warnings on macOS R 4.4.1, Windows R-devel (Winbuilder), and Ubuntu Linux R 4.6.2. The Linux run reported one expected `New submission` NOTE. Local macOS checks reported an additional system-time verification NOTE. The Windows R-release result has not been independently verified. Technical checks do not guarantee coverage under every data-generating process.

          Linux validation: https://github.com/sdbambil1/bambaganaCI/actions/runs/43519880509

          ## License and acknowledgements

          MIT License. ChatGPT assisted with code development, troubleshooting, testing, and documentation. The authors remain responsible for the software and its statistical claims.
          '''
          Path('public/README.md').write_text('\n'.join(x[10:] if x.startswith('          ') else x for x in readme.splitlines())+'\n')
          PY
          git -C public config user.name "Silas Bambil"
          git -C public config user.email "sbambil1@student.gsu.edu"
          git -C public add DESCRIPTION NEWS.md man/bambagana.Rd README.md
          git -C public diff --cached --check
          git -C public commit -m "Release bambaganaCI v0.3.4 from validated source"
          git -C public push origin HEAD:main

      - name: Create formal GitHub release and attach validated archive
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd public
          test "$(sed -n 's/^Version: //p' DESCRIPTION | tr -d '\r')" = "0.3.4"
          if gh release view v0.3.4 --repo sdbambil1/bambaganaCI >/dev/null 2>&1; then
            echo 'v0.3.4 release already exists; not overwriting'
            exit 1
          fi
          gh release create v0.3.4 \
            ../candidate/validation/bambaganaCI_0.3.4.tar.gz#bambaganaCI_0.3.4.tar.gz \
            --repo sdbambil1/bambaganaCI \
            --target "$(git rev-parse HEAD)" \
            --title "bambaganaCI v0.3.4" \
            --notes "Public GitHub release of bambaganaCI v0.3.4. Documentation and CRAN-readiness maintenance; the 40 statistical methods and 43 public exports remain unchanged. The attached source archive is the candidate that passed macOS, Windows R-devel, and Ubuntu Linux package checks with no errors or warnings. This package has not been published on CRAN." \
            --latest
